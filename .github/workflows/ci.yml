name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features aac
      - run: cargo test --no-default-features --features mp3
      - run: cargo test --all-features

  oracle:
    name: Oracle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo add-apt-repository --yes ppa:chris-needham/ppa
      - run: sudo apt-get update
      - run: sudo apt-get install --yes --no-install-recommends audiowaveform ffmpeg
      - run: audiowaveform --version && ffmpeg -version
      - run: cargo test --test oracle --all-features -- --ignored

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --features aac --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --features mp3 --all-targets -- -D warnings
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  docs-rs:
    name: docs.rs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target,
      # which the address sanitizer does not support.
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu ogg_opus -- -max_total_time=60 -max_len=32768 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu webm_opus -- -max_total_time=60 -max_len=32768 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu mp4 -- -max_total_time=60 -max_len=32768 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu adts_aac -- -max_total_time=60 -max_len=32768 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=64
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu mpeg_audio -- -max_total_time=60 -max_len=32768 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=64
