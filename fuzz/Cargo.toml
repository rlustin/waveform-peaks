[package]
name = "waveform-peaks-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.waveform-peaks]
path = ".."
features = ["aac"]

[[bin]]
name = "ogg_opus"
path = "fuzz_targets/ogg_opus.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webm_opus"
path = "fuzz_targets/webm_opus.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mp4"
path = "fuzz_targets/mp4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "adts_aac"
path = "fuzz_targets/adts_aac.rs"
test = false
doc = false
bench = false
